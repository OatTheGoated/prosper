<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Upload – Prosper</title>
    <link rel="stylesheet" href="../style.css?v=22">

    <!-- Supabase UMD (works on GitHub Pages) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://pnkwqqapyoxadcpubpwb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FOGjeeE78yPzd0dIz-18XQ_t2J6MMLz";

        // ⭐ FIX: use "client" instead of "supabase"
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
</head>

<body>
<div class="site">

    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper Admin</h1>
            <ul class="nav-links">
                <li><a href="/prosper/index.html">Home</a></li>
                <li><a href="/prosper/modpacks.html">Modpacks</a></li>
                <li><a href="/prosper/schematics.html">Schematics</a></li>
                <li><a href="/prosper/videos.html">Videos</a></li>
                <li><a href="/prosper/dashboard.html">Dashboard</a></li>

                <li><a href="/prosper/admin/upload.html" class="active" id="uploadTab">Upload</a></li>
                <li><a href="/prosper/login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" style="margin-top:40px;">
        <h1 class="pixel">Upload Schematic</h1>

        <div class="auth-box">
            <input id="name" placeholder="Name">
            <input id="tags" placeholder="Tags (comma separated)">
            <textarea id="description" placeholder="Description"></textarea>

            <h3 class="pixel-small">Schematic File (.schem / .litematic)</h3>
            <input id="schemFile" type="file">

            <h3 class="pixel-small">Preview Image (.webp)</h3>
            <input id="imageFile" type="file">

            <button class="btn-red" id="uploadBtn">Upload</button>
        </div>
    </section>

</div>

<script>
    let currentUser = null;

    // ⭐ ADMIN CHECK
    async function checkAdmin() {
        const { data: { user } } = await client.auth.getUser();

        if (!user) {
            alert("You must be logged in.");
            window.location.href = "/prosper/login.html";
            return;
        }

        currentUser = user;

        // Load profile to check role
        const { data: profile } = await client
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .maybeSingle();

        if (!profile || profile.role !== "admin") {
            alert("Access denied — admin only.");
            window.location.href = "/prosper/login.html";
            return;
        }
    }

    checkAdmin();

    // ⭐ UPLOAD BUTTON HANDLER
    document.getElementById("uploadBtn").onclick = async () => {
        if (!currentUser) {
            alert("Session expired. Please log in again.");
            window.location.href = "/prosper/login.html";
            return;
        }

        const name = document.getElementById("name").value.trim();
        const tags = document.getElementById("tags").value.trim();
        const description = document.getElementById("description").value.trim();

        const schemFile = document.getElementById("schemFile").files[0];
        const imageFile = document.getElementById("imageFile").files[0];

        if (!schemFile || !imageFile) {
            alert("Missing files");
            return;
        }

        // ⭐ Upload schematic file
        const schemPath = `public/${Date.now()}_${schemFile.name}`;
        const { error: schemErr } = await client.storage
            .from("schematics")
            .upload(schemPath, schemFile, {
                upsert: true,
                contentType: schemFile.type || "application/octet-stream"
            });

        if (schemErr) {
            console.error(schemErr);
            alert("Error uploading schematic");
            return;
        }

        const schemURL = client.storage
            .from("schematics")
            .getPublicUrl(schemPath).data.publicUrl;

        // ⭐ Upload image file
        const imagePath = `public/${Date.now()}_${imageFile.name}`;
        const { error: imgErr } = await client.storage
            .from("images")
            .upload(imagePath, imageFile, {
                upsert: true,
                contentType: imageFile.type || "image/webp"
            });

        if (imgErr) {
            console.error(imgErr);
            alert("Error uploading image");
            return;
        }

        const imageURL = client.storage
            .from("images")
            .getPublicUrl(imagePath).data.publicUrl;

        // ⭐ Insert metadata into database
        const { error: dbErr } = await client
            .from("schematics")
            .insert({
                name,
                description,
                tags: tags.split(",").map(t => t.trim()),
                file: schemURL,
                image: imageURL,
                uploaded_by: currentUser.id,
                created_at: new Date().toISOString()
            });

        if (dbErr) {
            console.error(dbErr);
            alert("Error saving metadata");
            return;
        }

        alert("Upload complete!");
    };

    // ⭐ ADMIN VISIBILITY
    async function applyAdminVisibility() {
        const uploadTab = document.getElementById("uploadTab");
        const { data: { user } } = await client.auth.getUser();

        if (!user) {
            uploadTab.style.display = "none";
            return;
        }

        const { data: profile } = await client
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .maybeSingle();

        if (!profile || profile.role !== "admin") {
            uploadTab.style.display = "none";
        }
    }

    applyAdminVisibility();
</script>

</body>
</html>
