<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Upload – Prosper</title>
    <link rel="stylesheet" href="../style.css?v=22">

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const client = supabase.createClient(
            "https://pnkwqqapyoaxdcpubpwb.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBua3dxcWFweW9heGRjcHVicHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MzcsImV4cCI6MjEwNjcxNjczN30.HiM5-OSJUoJ_3AXSkfEmhgWVs8lU5lNNj4FbIai1Bkc"
        );
    </script>

    <style>
        /* ⭐ CLEAN ALIGNED UPLOAD FORM */
        .upload-container {
            width: 90%;
            max-width: 700px;
            margin: auto;
            padding: 2rem;
            background: #111;
            border-radius: 20px;
            border: 3px solid #4db8ff; /* glowing blue */
            margin-top: 40px;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 1.2rem 1rem;
            align-items: center;
        }

        .upload-grid label {
            text-align: right;
            font-size: 1.2rem;
            color: #4db8ff; /* glowing blue */
            text-shadow: 0 0 8px #4db8ff;
        }

        .upload-grid input,
        .upload-grid textarea {
            width: 100%;
            padding: 0.7rem;
            border-radius: 10px;
            border: 2px solid #333;
            background: #222;
            color: #fff;
        }

        #uploadBtn {
            margin-top: 2rem;
            width: 100%;
            padding: 1rem;
            font-size: 1.3rem;
            background: #4db8ff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #000;
            font-weight: bold;
            text-shadow: 0 0 5px #fff;
        }

        /* ⭐ Thumbnail preview */
        .thumb-preview-box {
            grid-column: 1 / 3;
            margin-top: 1rem;
            text-align: center;
        }

        .thumb-preview {
            width: 200px;
            height: auto;
            border-radius: 10px;
            border: 2px solid #4db8ff; /* glowing blue */
            cursor: pointer;
            transition: transform 0.3s ease;
            display: none;
            box-shadow: 0 0 15px #4db8ff;
        }

        .thumb-preview:hover {
            transform: scale(1.05);
        }

        /* ⭐ Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: #111;
            padding: 1rem;
            border-radius: 10px;
            max-width: 900px;
            width: 90%;
            border: 2px solid #4db8ff; /* glowing blue */
            box-shadow: 0 0 20px #4db8ff;
        }
    </style>
</head>

<body>
<div class="site">

    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper Admin</h1>
            <ul class="nav-links">
                <li><a href="/prosper/index.html">Home</a></li>
                <li><a href="/prosper/modpacks.html">Modpacks</a></li>
                <li><a href="/prosper/schematics.html">Schematics</a></li>
                <li><a href="/prosper/videos.html">Videos</a></li>
                <li><a href="/prosper/dashboard.html">Dashboard</a></li>

                <li><a href="/prosper/admin/upload.html" class="active" id="uploadTab">Upload</a></li>
                <li><a href="/prosper/login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <h1 class="pixel">Upload Schematic</h1>

        <!-- ⭐ NEW CLEAN FORM -->
        <div class="upload-container">

            <div class="upload-grid">

                <label for="name">Name</label>
                <input id="name" placeholder="Name">

                <label for="tags">Tags</label>
                <input id="tags" placeholder="Tags (comma separated)">

                <label for="description">Description</label>
                <textarea id="description" placeholder="Description"></textarea>

                <label>Schematic File (.schem / .litematic)</label>
                <input id="schemFile" type="file">

                <label>Preview Image (.webp)</label>
                <input id="imageFile" type="file">

                <!-- ⭐ Thumbnail Preview -->
                <div class="thumb-preview-box">
                    <img id="thumbPreview" class="thumb-preview" src="" alt="Preview will appear here">
                </div>

            </div>

            <button id="uploadBtn">Upload</button>
        </div>
    </section>

</div>

<!-- ⭐ Image Zoom Modal -->
<div id="imageZoomModal" class="modal" onclick="closeImageZoom(event)">
    <div class="modal-content">
        <img id="zoomedImage" style="width:100%; border-radius:10px;">
    </div>
</div>

<script>
    let currentUser = null;

    // ⭐ ADMIN CHECK + AUTO-DETECT AUTHOR
    async function checkAdmin() {
        const { data: { session } } = await client.auth.getSession();

        if (!session) {
            alert("You must be logged in.");
            window.location.href = "/prosper/login.html";
            return;
        }

        const user = session.user;

        if (!user.user_metadata || user.user_metadata.role !== "admin") {
            alert("Access denied — admin only.");
            window.location.href = "/prosper/login.html";
            return;
        }

        currentUser = user;
    }

    checkAdmin();

    // ⭐ Thumbnail live preview
    document.getElementById("imageFile").addEventListener("change", function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const preview = document.getElementById("thumbPreview");
            preview.src = e.target.result;
            preview.style.display = "block";
        };
        reader.readAsDataURL(file);
    });

    // ⭐ Click to zoom thumbnail
    document.getElementById("thumbPreview").onclick = () => {
        const modal = document.getElementById("imageZoomModal");
        const zoomed = document.getElementById("zoomedImage");

        zoomed.src = document.getElementById("thumbPreview").src;
        modal.style.display = "flex";
    };

    // ⭐ Close zoom modal
    function closeImageZoom(event) {
        if (event.target.id === "imageZoomModal") {
            document.getElementById("imageZoomModal").style.display = "none";
        }
    }

    // ⭐ UPLOAD HANDLER
    document.getElementById("uploadBtn").onclick = async () => {
        if (!currentUser) {
            alert("Session expired. Log in again.");
            window.location.href = "/prosper/login.html";
            return;
        }

        const name = document.getElementById("name").value.trim();
        const tags = document.getElementById("tags").value.trim();
        const description = document.getElementById("description").value.trim();

        const schemFile = document.getElementById("schemFile").files[0];
        const imageFile = document.getElementById("imageFile").files[0];

        if (!name || !tags || !description) {
            alert("Fill in all fields.");
            return;
        }

        if (!schemFile || !imageFile) {
            alert("Missing files.");
            return;
        }

        // ⭐ Auto-detected author
        const author = currentUser.email;

        // ⭐ Upload schematic
        const schemPath = `public/${Date.now()}_${schemFile.name}`;
        const { error: schemErr } = await client.storage
            .from("schematics")
            .upload(schemPath, schemFile, {
                upsert: true,
                contentType: schemFile.type || "application/octet-stream"
            });

        if (schemErr) {
            console.error(schemErr);
            alert("Error uploading schematic.");
            return;
        }

        const schemURL = client.storage
            .from("schematics")
            .getPublicUrl(schemPath).data.publicUrl;

        // ⭐ Upload image
        const imagePath = `public/${Date.now()}_${imageFile.name}`;
        const { error: imgErr } = await client.storage
            .from("images")
            .upload(imagePath, imageFile, {
                upsert: true,
                contentType: imageFile.type || "image/webp"
            });

        if (imgErr) {
            console.error(imgErr);
            alert("Error uploading image.");
            return;
        }

        const imageURL = client.storage
            .from("images")
            .getPublicUrl(imagePath).data.publicUrl;

        // ⭐ Insert metadata (NOW FULLY AUTOMATIC AUTHOR)
        const { error: dbErr } = await client
            .from("schematics")
            .insert({
                name,
                description,
                tags: tags.split(",").map(t => t.trim()),
                file: schemURL,
                image: imageURL,
                author: author,
                uploaded_by: currentUser.id,
                created_at: new Date().toISOString()
            });

        if (dbErr) {
            console.error(dbErr);
            alert("Error saving metadata.");
            return;
        }

        alert("Upload complete!");
    };

    // ⭐ ADMIN VISIBILITY FIXED
    async function applyAdminVisibility() {
        const uploadTab = document.getElementById("uploadTab");

        const { data: { session } } = await client.auth.getSession();
        if (!session) {
            uploadTab.style.display = "none";
            return;
        }

        const user = session.user;

        if (!user.user_metadata || user.user_metadata.role !== "admin") {
            uploadTab.style.display = "none";
        }
    }

    applyAdminVisibility();
</script>

</body>
</html>
