<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Upload – Prosper</title>
    <link rel="stylesheet" href="../style.css?v=22">
</head>

<body>
<div class="site">

    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper Admin</h1>
            <ul class="nav-links">
                <li><a href="/prosper/index.html">Home</a></li>
                <li><a href="/prosper/modpacks.html">Modpacks</a></li>
                <li><a href="/prosper/schematics.html">Schematics</a></li>
                <li><a href="/prosper/videos.html">Videos</a></li>
                <li><a href="/prosper/dashboard.html">Dashboard</a></li>

                <!-- ⭐ Upload tab (admin only) -->
                <li><a href="/prosper/admin/upload.html" class="active" id="uploadTab">Upload</a></li>

                <li><a href="/prosper/login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" style="margin-top:40px;">
        <h1 class="pixel">Upload Schematic</h1>

        <div class="auth-box">
            <input id="name" placeholder="Name">
            <input id="tags" placeholder="Tags (comma separated)">
            <textarea id="description" placeholder="Description"></textarea>

            <h3 class="pixel-small">Schematic File (.schem / .litematic)</h3>
            <input id="schemFile" type="file">

            <h3 class="pixel-small">Preview Image (.webp)</h3>
            <input id="imageFile" type="file">

            <button class="btn-red" id="uploadBtn">Upload</button>
        </div>
    </section>

</div>

<!-- ⭐ ADMIN UPLOAD SCRIPT -->
<script type="module">
    import { auth, db, storage } from "../firebase-config.js";

    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    import {
        doc,
        getDoc,
        addDoc,
        collection
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    import {
        ref,
        uploadBytes,
        getDownloadURL
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

    // ⭐ ADMIN CHECK
    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            alert("You must be logged in.");
            window.location.href = "/prosper/login.html";
            return;
        }

        currentUser = user;

        // Load profile
        const profileRef = doc(db, "profiles", user.uid);
        const profileSnap = await getDoc(profileRef);

        if (!profileSnap.exists()) {
            alert("Profile not found.");
            window.location.href = "/prosper/login.html";
            return;
        }

        const profile = profileSnap.data();

        if (profile.role !== "admin") {
            alert("Access denied — admin only.");
            window.location.href = "/prosper/login.html";
            return;
        }
    });

    // ⭐ UPLOAD BUTTON HANDLER
    document.getElementById("uploadBtn").onclick = async () => {
        if (!currentUser) {
            alert("Session expired. Please log in again.");
            window.location.href = "/prosper/login.html";
            return;
        }

        const name = document.getElementById("name").value.trim();
        const tags = document.getElementById("tags").value.trim();
        const description = document.getElementById("description").value.trim();

        const schemFile = document.getElementById("schemFile").files[0];
        const imageFile = document.getElementById("imageFile").files[0];

        if (!schemFile || !imageFile) {
            alert("Missing files");
            return;
        }

        // ⭐ Upload schematic file to Firebase Storage
        const schemPath = `schematics/${Date.now()}_${schemFile.name}`;
        const schemRef = ref(storage, schemPath);

        try {
            await uploadBytes(schemRef, schemFile);
        } catch (err) {
            console.error(err);
            alert("Error uploading schematic");
            return;
        }

        const schemURL = await getDownloadURL(schemRef);

        // ⭐ Upload image file to Firebase Storage
        const imagePath = `images/${Date.now()}_${imageFile.name}`;
        const imageRef = ref(storage, imagePath);

        try {
            await uploadBytes(imageRef, imageFile);
        } catch (err) {
            console.error(err);
            alert("Error uploading image");
            return;
        }

        const imageURL = await getDownloadURL(imageRef);

        // ⭐ Insert metadata into Firestore
        try {
            await addDoc(collection(db, "schematics"), {
                name,
                description,
                tags: tags.split(",").map(t => t.trim()),
                file: schemURL,
                image: imageURL,
                uploaded_by: currentUser.email,
                uploaded_at: Date.now()
            });
        } catch (err) {
            console.error(err);
            alert("Error saving metadata");
            return;
        }

        alert("Upload complete!");
    };
</script>

<!-- ⭐ ADMIN VISIBILITY SCRIPT -->
<script type="module">
    import { auth, db } from "../firebase-config.js";
    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
        const uploadTab = document.getElementById("uploadTab");
        if (!uploadTab) return;

        if (!user) {
            uploadTab.style.display = "none";
            return;
        }

        const profileRef = doc(db, "profiles", user.uid);
        const profileSnap = await getDoc(profileRef);

        if (!profileSnap.exists() || profileSnap.data().role !== "admin") {
            uploadTab.style.display = "none";
        }
    });
</script>

</body>
</html>
