<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body { background:#111; color:#fff; font-family:Arial; text-align:center; padding-top:50px; }
    input, button { padding:10px; margin:10px; width:250px; border-radius:6px; border:none; }
    button { background:#4CAF50; color:white; cursor:pointer; }
  </style>
</head>
<body>

<h2>Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

  /* ⭐ UPDATED TO YOUR NEW DATABASE */
  const supabase = createClient(
    "https://pnkwqqapyoxadcpubpwb.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBua3dxcWFweW9heGRjcHVicHdiIiwicm9zZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MzcsImV4cCI6MjEwNjcxNjczN30.HiM5-OSJUoJ_3AXSkfEmhgWVs8lU5lNNj4FbIai1Bkc"
  );

  document.getElementById("loginBtn").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      alert("Enter an email and password.");
      return;
    }

    // ⭐ LOGIN
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      alert("Login failed: " + error.message);
      return;
    }

    // ⭐ GET USER
    const { data: { user } } = await supabase.auth.getUser();

    if (!user) {
      alert("Unexpected error: no user returned.");
      return;
    }

    // ⭐ CHECK ROLE
    const role = user.user_metadata?.role;

    if (role === "admin") {
      window.location.href = "/prosper/admin/upload.html";
    } else {
      window.location.href = "/prosper/schematics.html";
    }
  };
</script>

</body>
</html>
