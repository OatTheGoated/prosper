<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register – Prosper</title>
    <link rel="stylesheet" href="./style.css?v=30">

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const client = supabase.createClient(
            "https://pnkwqqapyoaxdcpubpwb.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBua3dxcWFweW9heGRjcHVicHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MzcsImV4cCI6MjEwNjcxNjczN30.HiM5-OSJUoJ_3AXSkfEmhgWVs8lU5lNNj4FbIai1Bkc"
        );
    </script>
</head>

<body>
<div class="site">
    <h1 class="pixel" style="text-align:center;">Create Account</h1>

    <div class="form-box">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <input id="username" type="text" placeholder="Username">
        <button id="registerBtn">Register</button>
        <p id="msg"></p>
    </div>
</div>

<script>
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const usernameInput = document.getElementById("username");
    const msg = document.getElementById("msg");

    document.getElementById("registerBtn").onclick = async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        const username = usernameInput.value.trim();

        if (!email || !password || !username) {
            msg.textContent = "Please fill in all fields.";
            return;
        }

        msg.textContent = "Creating account...";

        // ⭐ FIXED SIGNUP WITH CORRECT REDIRECT URL
        const { data, error } = await client.auth.signUp({
            email,
            password,
            options: {
                emailRedirectTo: "https://oatthegoated.github.io/prosper/login.html"
            }
        });

        if (error) {
            msg.textContent = error.message;
            return;
        }

        const user = data.user;
        if (!user) {
            msg.textContent = "Unexpected error.";
            return;
        }

        await client.from("profiles").insert({
            id: user.id,
            email,
            username,
            role: "user"
        });

        msg.textContent = "Account created! Check your email to confirm.";
    };
</script>

</body>
</html>
