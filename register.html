<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register – Prosper</title>
    <link rel="stylesheet" href="./style.css?v=30">

    <!-- Supabase JS (UMD, works on GitHub Pages) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://pnkwqqapyoxadcpubpwb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FOGjeeE78yPzd0dIz-18XQ_t2J6MMLz";

        // ⭐ FIX: use "client" instead of "supabase"
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
</head>

<body>
<div class="site">
    <h1 class="pixel" style="text-align:center;">Create Account</h1>

    <div class="form-box">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <input id="username" type="text" placeholder="Username">
        <button id="registerBtn" type="button">Register</button>
        <p id="msg"></p>
    </div>
</div>

<script>
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const usernameInput = document.getElementById("username");
    const registerBtn = document.getElementById("registerBtn");
    const msg = document.getElementById("msg");

    registerBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        const username = usernameInput.value.trim();

        if (!email || !password || !username) {
            msg.textContent = "Please fill in all fields.";
            return;
        }

        msg.textContent = "Creating account...";

        try {
            // ⭐ FIX: use client instead of supabase
            const { data, error } = await client.auth.signUp({
                email,
                password
            });

            if (error) {
                msg.textContent = error.message;
                return;
            }

            const user = data.user;
            if (!user) {
                msg.textContent = "Could not create user. Please try again.";
                return;
            }

            // Insert profile row
            const { error: profileError } = await client
                .from("profiles")
                .insert({
                    id: user.id,
                    username: username,
                    email: email,
                    role: "user"
                });

            if (profileError) {
                msg.textContent = "Account created, but profile failed: " + profileError.message;
                return;
            }

            msg.textContent = "Account created! Redirecting...";
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);

        } catch (err) {
            msg.textContent = "Unexpected error: " + err.message;
        }
    });
</script>

</body>
</html>
