<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - Prosper</title>

<style>
    body {
        background-color: #0a0a0a;
        color: #fff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    h1.pixel {
        font-size: 2.5rem;
        background: linear-gradient(90deg, #E8C547, #C9A227, #A67C00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
        margin-top: 2rem;
    }

    /* CATEGORY HUB */
    #categoryHub {
        display: flex;
        justify-content: center;
        gap: 4rem;
        padding: 4rem 2rem;
        transition: opacity 0.5s ease;
    }

    .category-card {
        width: 420px;
        height: 260px;
        background: #111;
        border-radius: 20px;
        border: 5px solid transparent;
        background-image: linear-gradient(#111, #111),
            linear-gradient(90deg, #E8C547, #C9A227, #A67C00);
        background-origin: border-box;
        background-clip: content-box, border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2.3rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .category-card:hover {
        transform: scale(1.1);
        box-shadow: 0 0 45px #C9A227;
    }

    /* INSIDE VIEW */
    #insideView {
        display: none;
        opacity: 0;
        transition: opacity 0.5s ease;
        padding: 2rem;
        margin-top: 2rem;
    }

    #backBtn {
        font-size: 1.4rem;
        margin-bottom: 1rem;
        cursor: pointer;
        color: #E8C547;
    }

    /* SECTION TITLES */
    .section-title {
        font-size: 2.2rem;
        margin: 1rem 0;
        background: linear-gradient(90deg, #E8C547, #C9A227, #A67C00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* SLIDER */
    .slider-container {
        margin-bottom: 3rem;
    }

    .slider {
        display: flex;
        justify-content: center;
        gap: 2rem;
        padding: 1rem 0;
        overflow-x: auto;
    }

    .slider::-webkit-scrollbar {
        display: none;
    }

    /* VIDEO CARDS BIGGER */
    .video-card {
        min-width: 360px;
        background: #111;
        border-radius: 16px;
        overflow: hidden;
        cursor: pointer;
        border: 4px solid transparent;
        background-image: linear-gradient(#111, #111),
            linear-gradient(90deg, #E8C547, #C9A227, #A67C00);
        background-origin: border-box;
        background-clip: content-box, border-box;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .video-card:hover {
        transform: scale(1.1);
        box-shadow: 0 0 35px #C9A227;
    }

    .video-thumb {
        width: 100%;
        height: 240px;
        object-fit: cover;
    }

    .video-info {
        padding: 1rem;
    }

    .video-title {
        font-size: 1.4rem;
        font-weight: bold;
        background: linear-gradient(90deg, #E8C547, #C9A227, #A67C00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .video-creator {
        font-size: 1.1rem;
        color: #ccc;
    }

    /* REMOVE ARROWS */
    .arrow {
        display: none;
    }

    /* MODAL */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .modal-content {
        background: #111;
        padding: 1rem;
        border-radius: 10px;
        max-width: 900px;
        width: 90%;
        border: 2px solid #E8C547;
    }

    .modal-close {
        float: right;
        font-size: 1.5rem;
        cursor: pointer;
        color: #E8C547;
    }

    iframe {
        width: 100%;
        height: 500px;
        border: none;
    }
</style>
</head>

<body>

<h1 class="pixel">📺 Prosper Videos</h1>

<!-- CATEGORY HUB -->
<div id="categoryHub">
    <div class="category-card" onclick="openCategory('crazycraft')">CrazyCraft</div>
    <div class="category-card" onclick="openCategory('cobblemon')">Cobblemon</div>
    <div class="category-card" onclick="openCategory('tutorials')">Tutorials</div>
</div>

<!-- INSIDE VIEW -->
<div id="insideView">
    <div id="backBtn" onclick="goBack()">← Back</div>
    <h2 id="insideTitle" class="section-title"></h2>
    <div id="insideContent"></div>
</div>

<!-- MODAL -->
<div id="videoModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">✖</span>
        <iframe id="videoFrame" src="" allowfullscreen></iframe>
    </div>
</div>

<script>
/* VIDEO DATA WITH REAL YOUTUBE TITLES */
const crazycraft = {
    "Oat – OatTheGoat": [
        {id:"SCqH3f3Eyws", title:"CrazyCraft Ep 1"},
        {id:"1NkML6ljVF4", title:"CrazyCraft Ep 2"},
        {id:"j-6P1al5CCs", title:"CrazyCraft Ep 3"},
        {id:"8to_n6dYBcU", title:"CrazyCraft Ep 4"}
    ],
    "Crowqe – Crowqe": [
        {id:"8QQS7HjOJIE", title:"CrazyCraft Ep 1"},
        {id:"VljkxVIGYRk", title:"CrazyCraft Ep 2"},
        {id:"uUODDSPJ-2g", title:"CrazyCraft Ep 3"},
        {id:"DKl8yx2ytXk", title:"CrazyCraft Ep 4"}
    ],
    "Cluck – Cluck": [
        {id:"UUsDq20GAoQ", title:"CrazyCraft Ep 1"},
        {id:"d3cXOOWj1-A", title:"CrazyCraft Ep 2"},
        {id:"V96iGVNEP1w", title:"CrazyCraft Ep 3"},
        {id:"aymQOS31wY8", title:"CrazyCraft Ep 4"}
    ]
};

const cobblemon = {
    "Oat – OatTheGoat": [
        {id:"V_iyvXQrhgg", title:"Cobblemon Ep 1"},
        {id:"K043mMMi5Vw", title:"Cobblemon Ep 2"},
        {id:"-Cv7sl-uhMs", title:"Cobblemon Ep 3"},
        {id:"XojOlNrDP4A", title:"Cobblemon Ep 4"}
    ],
    "Crowqe – Crowqe": [
        {id:"Ndlcw3Gfl_4", title:"Cobblemon Ep 1"},
        {id:"o0jfMdlmV6g", title:"Cobblemon Ep 2"},
        {id:"d4Rf41MRar4", title:"Cobblemon Ep 3"}
    ]
};

const tutorials = {
    "Prosper Tutorials": [
        {id:"ufkKoSTg-wA", title:"How to Install Modpacks"},
        {id:"s50sal6owuY", title:"How to Use ProsperMC"}
    ]
};

/* PAGE SWITCHING */
function openCategory(cat) {
    const hub = document.getElementById("categoryHub");
    const inside = document.getElementById("insideView");

    hub.style.opacity = 0;

    setTimeout(() => {
        hub.style.visibility = "hidden";
        inside.style.visibility = "visible";
        inside.style.display = "block";
        setTimeout(() => inside.style.opacity = 1, 50);
        loadCategory(cat);
    }, 500);
}

function goBack() {
    const hub = document.getElementById("categoryHub");
    const inside = document.getElementById("insideView");

    inside.style.opacity = 0;

    setTimeout(() => {
        inside.style.visibility = "hidden";
        inside.style.display = "none";
        hub.style.visibility = "visible";
        setTimeout(() => hub.style.opacity = 1, 50);
    }, 500);
}

/* LOAD CATEGORY ROWS */
function loadCategory(cat) {
    const title = document.getElementById("insideTitle");
    const content = document.getElementById("insideContent");
    content.innerHTML = "";

    if (cat === "crazycraft") {
        title.innerText = "CrazyCraft";
        renderCreatorRows(crazycraft, content);
    }
    if (cat === "cobblemon") {
        title.innerText = "Cobblemon";
        renderCreatorRows(cobblemon, content);
    }
    if (cat === "tutorials") {
        title.innerText = "Tutorials";
        renderCreatorRows(tutorials, content);
    }
}

/* CREATOR ROWS */
function renderCreatorRows(data, container) {
    Object.keys(data).forEach(creator => {

        const row = document.createElement("div");

        row.innerHTML = `
            <h3 class="section-title">${creator}</h3>
            <div class="slider-container">
                <div id="${creator}" class="slider"></div>
            </div>
        `;

        container.appendChild(row);

        const slider = document.getElementById(creator);

        data[creator].forEach(video => {
            const card = document.createElement("div");
            card.className = "video-card";
            card.onclick = () => openModal(video.id);

            card.innerHTML = `
                <img class="video-thumb" src="https://img.youtube.com/vi/${video.id}/maxresdefault.jpg">
                <div class="video-info">
                    <div class="video-title">${video.title}</div>
                    <div class="video-creator">${creator}</div>
                </div>
            `;
            slider.appendChild(card);
        });
    });
}

/* MODAL */
function openModal(videoId) {
    document.getElementById("videoModal").style.display = "flex";
    document.getElementById("videoFrame").src = `https://www.youtube.com/embed/${videoId}`;
}
function closeModal() {
    document.getElementById("videoModal").style.display = "none";
    document.getElementById("videoFrame").src = "";
}
</script>

</body>
</html>
