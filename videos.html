<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos - Prosper</title>

<style>
    body {
        background-color: #0a0a0a;
        color: #fff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    h1.pixel {
        font-size: 2.5rem;
        background: linear-gradient(90deg, #E8C547, #C9A227, #A67C00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
        margin-top: 2rem;
    }

    /* CATEGORY HUB */
    #categoryHub {
        display: flex;
        justify-content: center;
        gap: 2rem;
        padding: 3rem;
        transition: opacity 0.5s ease;
    }

    .category-card {
        width: 300px;
        height: 180px;
        background: #111;
        border-radius: 12px;
        border: 3px solid transparent;
        background-image: linear-gradient(#111, #111), 
            linear-gradient(90deg, #E8C547, #C9A227, #A67C00);
        background-origin: border-box;
        background-clip: content-box, border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.6rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .category-card:hover {
        transform: scale(1.05);
        box-shadow: 0 0 25px #C9A227;
    }

    /* INSIDE VIEW */
    #insideView {
        display: none;
        opacity: 0;
        transition: opacity 0.5s ease;
        padding: 2rem;
    }

    #backBtn {
        font-size: 1.2rem;
        margin-bottom: 1rem;
        cursor: pointer;
        color: #E8C547;
    }

    .section-title {
        font-size: 2rem;
        margin: 1rem 0;
        background: linear-gradient(90deg, #E8C547, #C9A227, #A67C00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* SLIDER */
    .slider-container {
        position: relative;
        margin-bottom: 3rem;
    }

    .slider {
        display: flex;
        overflow-x: auto;
        scroll-behavior: smooth;
        gap: 1.5rem;
        padding: 1rem 0;
    }

    .slider::-webkit-scrollbar {
        display: none;
    }

    .video-card {
        min-width: 260px;
        background: #111;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        border: 2px solid transparent;
        background-image: linear-gradient(#111, #111),
            linear-gradient(90deg, #E8C547, #C9A227, #A67C00);
        background-origin: border-box;
        background-clip: content-box, border-box;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .video-card:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px #C9A227;
    }

    .video-thumb {
        width: 100%;
        height: 150px;
        object-fit: cover;
    }

    .video-info {
        padding: 0.8rem;
    }

    .video-title {
        font-size: 1.1rem;
        font-weight: bold;
        background: linear-gradient(90deg, #E8C547, #C9A227, #A67C00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .video-creator {
        font-size: 0.9rem;
        color: #ccc;
    }

    /* ARROWS */
    .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 2.5rem;
        color: #E8C547;
        cursor: pointer;
        z-index: 10;
        user-select: none;
        padding: 0 10px;
    }

    .arrow-left { left: 0; }
    .arrow-right { right: 0; }

    /* MODAL */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .modal-content {
        background: #111;
        padding: 1rem;
        border-radius: 10px;
        max-width: 900px;
        width: 90%;
        border: 2px solid #E8C547;
    }

    .modal-close {
        float: right;
        font-size: 1.5rem;
        cursor: pointer;
        color: #E8C547;
    }

    iframe {
        width: 100%;
        height: 500px;
        border: none;
    }
</style>
</head>

<body>

<h1 class="pixel">📺 Prosper Videos</h1>

<!-- CATEGORY HUB -->
<div id="categoryHub">
    <div class="category-card" onclick="openCategory('crazycraft')">CrazyCraft</div>
    <div class="category-card" onclick="openCategory('cobblemon')">Cobblemon</div>
    <div class="category-card" onclick="openCategory('tutorials')">Tutorials</div>
</div>

<!-- INSIDE VIEW -->
<div id="insideView">
    <div id="backBtn" onclick="goBack()">← Back</div>
    <h2 id="insideTitle" class="section-title"></h2>

    <div id="insideContent"></div>
</div>

<!-- MODAL -->
<div id="videoModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">✖</span>
        <iframe id="videoFrame" src="" allowfullscreen></iframe>
    </div>
</div>

<script>
/* VIDEO DATA */
const crazycraft = {
    Oat: ["SCqH3f3Eyws","1NkML6ljVF4","j-6P1al5CCs","8to_n6dYBcU"],
    Crowqe: ["8QQS7HjOJIE","VljkxVIGYRk","uUODDSPJ-2g","DKl8yx2ytXk"],
    Cluck: ["UUsDq20GAoQ","d3cXOOWj1-A","V96iGVNEP1w","aymQOS31wY8"]
};

const cobblemon = {
    Oat: ["V_iyvXQrhgg","K043mMMi5Vw","-Cv7sl-uhMs","XojOlNrDP4A"],
    Crowqe: ["Ndlcw3Gfl_4","o0jfMdlmV6g","d4Rf41MRar4"]
};

const tutorials = {
    Prosper: ["ufkKoSTg-wA","s50sal6owuY"]
};

/* PAGE SWITCHING */
function openCategory(cat) {
    document.getElementById("categoryHub").style.opacity = 0;

    setTimeout(() => {
        document.getElementById("categoryHub").style.display = "none";

        document.getElementById("insideView").style.display = "block";
        setTimeout(() => {
            document.getElementById("insideView").style.opacity = 1;
        }, 50);

        loadCategory(cat);
    }, 500);
}

function goBack() {
    document.getElementById("insideView").style.opacity = 0;

    setTimeout(() => {
        document.getElementById("insideView").style.display = "none";

        document.getElementById("categoryHub").style.display = "flex";
        setTimeout(() => {
            document.getElementById("categoryHub").style.opacity = 1;
        }, 50);
    }, 500);
}

/* LOAD CATEGORY ROWS */
function loadCategory(cat) {
    const title = document.getElementById("insideTitle");
    const content = document.getElementById("insideContent");
    content.innerHTML = "";

    if (cat === "crazycraft") {
        title.innerText = "CrazyCraft";
        renderCreatorRows(crazycraft, content);
    }
    if (cat === "cobblemon") {
        title.innerText = "Cobblemon";
        renderCreatorRows(cobblemon, content);
    }
    if (cat === "tutorials") {
        title.innerText = "Tutorials";
        renderCreatorRows(tutorials, content);
    }
}

/* CREATOR ROWS */
function renderCreatorRows(data, container) {
    Object.keys(data).forEach(creator => {
        const row = document.createElement("div");

        row.innerHTML = `
            <h3 class="section-title">${creator}</h3>
            <div class="slider-container">
                <div class="arrow arrow-left" onclick="scrollLeft('${creator}')">&#10094;</div>
                <div class="arrow arrow-right" onclick="scrollRight('${creator}')">&#10095;</div>
                <div id="${creator}" class="slider"></div>
            </div>
        `;

        container.appendChild(row);

        const slider = document.getElementById(creator);

        data[creator].forEach(id => {
            const card = document.createElement("div");
            card.className = "video-card";
            card.onclick = () => openModal(id);

            card.innerHTML = `
                <img class="video-thumb" src="https://img.youtube.com/vi/${id}/maxresdefault.jpg">
                <div class="video-info">
                    <div class="video-title">${creator} Video</div>
                    <div class="video-creator">${creator}</div>
                </div>
            `;
            slider.appendChild(card);
        });
    });
}

/* SLIDER ARROWS */
function scrollLeft(id) {
    document.getElementById(id).scrollLeft -= 300;
}
function scrollRight(id) {
    document.getElementById(id).scrollLeft += 300;
}

/* MODAL */
function openModal(videoId) {
    document.getElementById("videoModal").style.display = "flex";
    document.getElementById("videoFrame").src = `https://www.youtube.com/embed/${videoId}`;
}
function closeModal() {
    document.getElementById("videoModal").style.display = "none";
    document.getElementById("videoFrame").src = "";
}
</script>

</body>
</html>
