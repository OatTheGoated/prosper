<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Prosper</title>
    <link rel="stylesheet" href="./style.css?v=30">

    <!-- Supabase JS (UMD version — works on GitHub Pages) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://pnkwqqapyoxadcpubpwb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FOGjeeE78yPzd0dIz-18XQ_t2J6MMLz";

        // ⭐ Use "client" instead of "supabase" to avoid global conflicts
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
</head>

<body>
<div class="site">
    <h1 class="pixel" style="text-align:center;">Login</h1>

    <div class="form-box">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button id="loginBtn">Login</button>
        <p id="msg"></p>
    </div>
</div>

<script>
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("msg");

    loginBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
            msg.textContent = "Please enter both email and password.";
            return;
        }

        msg.textContent = "Logging in...";

        try {
            // ⭐ Supabase login
            const { data, error } = await client.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                msg.textContent = error.message;
                return;
            }

            msg.textContent = "Success! Redirecting...";
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1200);

        } catch (err) {
            msg.textContent = "Unexpected error: " + err.message;
        }
    });
</script>

</body>
</html>
