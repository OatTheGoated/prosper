<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Prosper</title>
    <link rel="stylesheet" href="./style.css?v=30">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const client = supabase.createClient(
            "https://pnkwqqapyoaxdcpubpwb.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBua3dxcWFweW9heGRjcHVicHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MzcsImV4cCI6MjEwNjcxNjczN30.HiM5-OSJUoJ_3AXSkfEmhgWVs8lU5lNNj4FbIai1Bkc"
        );
    </script>
</head>

<body>
<div class="site">
    <h1 class="pixel" style="text-align:center;">Login</h1>

    <div class="form-box">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button id="loginBtn">Login</button>
        <p id="msg"></p>
    </div>
</div>

<script>
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const msg = document.getElementById("msg");

    document.getElementById("loginBtn").onclick = async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
            msg.textContent = "Please enter both fields.";
            return;
        }

        msg.textContent = "Logging in...";

        const { error } = await client.auth.signInWithPassword({ email, password });

        if (error) {
            msg.textContent = error.message;
            return;
        }

        msg.textContent = "Success! Loading session...";

        // ⭐ Wait for Supabase to fully restore the session
        let tries = 0;
        let session = null;

        while (tries < 10) {
            const { data } = await client.auth.getSession();
            session = data.session;

            if (session) break;

            await new Promise(r => setTimeout(r, 200));
            tries++;
        }

        if (!session) {
            msg.textContent = "Error: Session did not load. Try again.";
            return;
        }

        msg.textContent = "Session ready! Redirecting...";
        window.location.href = "dashboard.html";
    };
</script>

</body>
</html>
