<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Prosper</title>
    <link rel="stylesheet" href="./style.css?v=30">
</head>

<body>
<div class="site">
    <h1 class="pixel" style="text-align:center;">Login</h1>

    <div class="form-box">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button id="loginBtn">Login</button>
        <p id="msg"></p>
    </div>
</div>

<!-- ⭐ Supabase Login Script -->
<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    // ⭐ Your real Supabase project
    const supabase = createClient(
        "https://pnkwqqapyoxadcpubpwb.supabase.co",
        "sb_publishable_FOGjeeE78yPzd0dIz-18XQ_t2J6MMLz"
    );

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("msg");

    loginBtn.addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
            msg.textContent = "Please enter both email and password.";
            return;
        }

        msg.textContent = "Logging in...";

        // ⭐ Supabase login
        const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            msg.textContent = error.message;
            return;
        }

        msg.textContent = "Success! Redirecting...";
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1200);
    });
</script>

</body>
</html>
