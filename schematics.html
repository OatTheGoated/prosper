<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProsperMC Schematics</title>

    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 32px;
        }

        .schem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .schem-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 10px #000;
        }

        .schem-card img {
            width: 100%;
            border-radius: 8px;
        }

        .schem-card h3 {
            margin-top: 10px;
            font-size: 20px;
        }

        .schem-card p {
            font-size: 14px;
            opacity: 0.85;
        }

        .schem-card button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .like-btn {
            background: #ff4444 !important;
        }

        .delete-btn {
            background: #aa0000 !important;
        }
    </style>
</head>
<body>

<!-- ⭐ NAVBAR -->
<nav class="navbar" style="background:#000; padding:10px 20px;">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between;">
        <h1 class="logo pixel">⛏️ Prosper</h1>
        <ul class="nav-links" style="list-style:none; display:flex; gap:20px; padding:0; margin:0;">
            <li><a href="index.html">Home</a></li>
            <li><a href="modpacks.html">Modpacks</a></li>
            <li><a href="schematics.html" class="active">Schematics</a></li>
            <li><a href="videos.html">Videos</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>

            <!-- ⭐ Upload tab (admin only) -->
            <li><a href="/prosper/admin/upload.html" id="uploadTab">Upload</a></li>

            <li><a href="login.html">Login</a></li>
        </ul>
    </div>
</nav>

<h1>ProsperMC Schematics</h1>

<div id="schemContainer" class="schem-grid"></div>

<!-- ⭐ MAIN SCRIPT -->
<script type="module">
    import { auth, db, storage } from "./firebase-config.js";

    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    import {
        collection,
        getDocs,
        doc,
        getDoc,
        deleteDoc,
        query,
        where,
        addDoc
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    import {
        ref,
        getDownloadURL,
        deleteObject
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

    let currentUser = null;
    let currentProfile = null;

    // ⭐ Load user + profile
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;

        if (user) {
            const profileRef = doc(db, "profiles", user.uid);
            const profileSnap = await getDoc(profileRef);
            if (profileSnap.exists()) {
                currentProfile = profileSnap.data();
            }
        }

        loadSchematics();
        applyAdminVisibility();
    });

    // ⭐ Load schematics from Firestore
    async function loadSchematics() {
        const container = document.getElementById("schemContainer");
        container.innerHTML = "";

        const schemSnap = await getDocs(collection(db, "schematics"));

        for (const docSnap of schemSnap.docs) {
            const s = docSnap.data();
            const id = docSnap.id;

            // ⭐ Get image URL
            const imageURL = s.image;

            // ⭐ Get schematic file URL
            const fileURL = s.file;

            // ⭐ Count likes
            const likesSnap = await getDocs(
                query(collection(db, "schematic_likes"), where("schematic_id", "==", id))
            );
            const likeCount = likesSnap.size;

            const card = document.createElement("div");
            card.className = "schem-card";

            card.innerHTML = `
                <img src="${imageURL}" alt="${s.name}">
                <h3>${s.name}</h3>
                <p>${s.description}</p>
                <p><strong>Tags:</strong> ${Array.isArray(s.tags) ? s.tags.join(", ") : s.tags}</p>

                <button onclick="window.location='${fileURL}'">
                    Download Schematic
                </button>

                <button class="like-btn" onclick="likeSchematic('${id}')">
                    ❤️ Like (${likeCount})
                </button>
            `;

            // ⭐ Admin delete button
            if (currentProfile && currentProfile.role === "admin") {
                const delBtn = document.createElement("button");
                delBtn.className = "delete-btn";
                delBtn.innerText = "🗑️ Delete Schematic";
                delBtn.onclick = () => deleteSchematic(id, s);
                card.appendChild(delBtn);
            }

            container.appendChild(card);
        }
    }

    // ⭐ Like schematic
    async function likeSchematic(id) {
        if (!currentUser) {
            alert("You must be logged in to like schematics.");
            return;
        }

        // Check if already liked
        const likesSnap = await getDocs(
            query(collection(db, "schematic_likes"),
                where("user_id", "==", currentUser.uid),
                where("schematic_id", "==", id)
            )
        );

        if (!likesSnap.empty) {
            alert("You already liked this schematic.");
            return;
        }

        await addDoc(collection(db, "schematic_likes"), {
            user_id: currentUser.uid,
            schematic_id: id
        });

        loadSchematics();
    }

    // ⭐ Delete schematic (admin only)
    async function deleteSchematic(id, s) {
        if (!confirm("Are you sure you want to delete this schematic?")) return;

        // Delete image file
        try {
            await deleteObject(ref(storage, s.image));
        } catch (err) {
            console.warn("Image delete failed:", err);
        }

        // Delete schematic file
        try {
            await deleteObject(ref(storage, s.file));
        } catch (err) {
            console.warn("Schematic delete failed:", err);
        }

        // Delete metadata
        await deleteDoc(doc(db, "schematics", id));

        // Delete likes
        const likesSnap = await getDocs(
            query(collection(db, "schematic_likes"), where("schematic_id", "==", id))
        );
        likesSnap.forEach(async (likeDoc) => {
            await deleteDoc(doc(db, "schematic_likes", likeDoc.id));
        });

        alert("Schematic deleted.");
        loadSchematics();
    }

    // ⭐ Admin visibility
    function applyAdminVisibility() {
        const uploadTab = document.getElementById("uploadTab");

        if (!currentProfile || currentProfile.role !== "admin") {
            uploadTab.style.display = "none";
        }
    }
</script>

</body>
</html>
