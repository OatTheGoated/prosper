<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProsperMC Schematics</title>

    <style>
        :root {
            --bg: #111;
            --card-bg: #1a1a1a;
            --text: #fff;
            --accent: #4CAF50;
            --accent-red: #ff4444;
            --accent-darkred: #aa0000;
        }

        body.light {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #111;
            --accent: #4CAF50;
            --accent-red: #ff4444;
            --accent-darkred: #aa0000;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.2s, color 0.2s;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 32px;
        }

        .navbar {
            background:#000;
            padding:10px 20px;
        }

        .navbar .container {
            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        .nav-links {
            list-style:none;
            display:flex;
            gap:20px;
            padding:0;
            margin:0;
        }

        .nav-links a {
            color:#fff;
            text-decoration:none;
        }

        .nav-links a.active {
            text-decoration:underline;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 20px;
            flex-wrap: wrap;
        }

        .top-bar input, .top-bar select, .top-bar button {
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
        }

        .top-bar button {
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }

        .featured {
            padding: 10px 20px;
        }

        .featured-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 10px #000;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .featured-card img {
            width: 200px;
            border-radius: 8px;
        }

        .featured-card h2 {
            margin: 0 0 5px 0;
        }

        .tag-badges {
            margin-top: 5px;
        }

        .tag-badge {
            display:inline-block;
            padding:4px 8px;
            border-radius:999px;
            background:#333;
            font-size:12px;
            margin-right:4px;
            margin-top:4px;
        }

        .schem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .schem-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 10px #000;
        }

        .schem-card img {
            width: 100%;
            border-radius: 8px;
        }

        .schem-card h3 {
            margin-top: 10px;
            font-size: 20px;
        }

        .schem-card p {
            font-size: 14px;
            opacity: 0.85;
        }

        .schem-card button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .like-btn {
            background: var(--accent-red) !important;
        }

        .delete-btn {
            background: var(--accent-darkred) !important;
        }

        .pagination {
            display:flex;
            justify-content:center;
            gap:10px;
            padding:10px 0 20px;
        }

        .pagination button {
            padding:6px 12px;
            border-radius:6px;
            border:none;
            cursor:pointer;
        }

        .pagination button.active {
            background:var(--accent);
            color:#fff;
        }
    </style>

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const client = supabase.createClient(
            "https://pnkwqqapyoaxdcpubpwb.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBua3dxcWFweW9heGRjcHVicHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MzcsImV4cCI6MjEwNjcxNjczN30.HiM5-OSJUoJ_3AXSkfEmhgWVs8lU5lNNj4FbIai1Bkc"
        );

        let currentUser = null;
        let allSchems = [];
        let allLikes = [];
        let allProfiles = [];
        let currentPage = 1;
        const pageSize = 8;
    </script>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <h1 class="logo pixel">⛏️ Prosper</h1>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="modpacks.html">Modpacks</a></li>
            <li><a href="schematics.html" class="active">Schematics</a></li>
            <li><a href="videos.html">Videos</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="/prosper/admin/upload.html" id="uploadTab">Upload</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </div>
</nav>

<h1>ProsperMC Schematics</h1>

<!-- ⭐ Search + Category + Author + Sort + Theme -->
<div class="top-bar">
    <input id="searchInput" placeholder="Search schematics...">
    <select id="categorySelect">
        <option value="">All Categories</option>
    </select>
    <select id="authorSelect">
        <option value="">All Authors</option>
    </select>
    <select id="sortSelect">
        <option value="newest">Newest</option>
        <option value="liked">Most Liked</option>
        <option value="alpha">Alphabetical</option>
    </select>
    <button id="themeToggle">Toggle Theme</button>
</div>

<!-- ⭐ Featured schematic -->
<div class="featured">
    <div id="featuredCard" class="featured-card" style="display:none;"></div>
</div>

<div id="schemContainer" class="schem-grid"></div>

<div class="pagination" id="pagination"></div>

<script>
    async function loadUser() {
        const { data: { session } } = await client.auth.getSession();
        currentUser = session?.user || null;
    }

    async function loadData() {
        const [schemRes, likeRes, profileRes] = await Promise.all([
            client.from("schematics").select("*").order("created_at", { ascending: false }),
            client.from("schematic_likes").select("schematic_id, user_id"),
            client.from("profiles").select("id, username")
        ]);

        allSchems = schemRes.data || [];
        allLikes = likeRes.data || [];
        allProfiles = profileRes.data || [];

        populateFilters();
        renderFeatured();
        renderSchematics();
        renderPagination();
    }

    function populateFilters() {
        const categorySelect = document.getElementById("categorySelect");
        const authorSelect = document.getElementById("authorSelect");

        categorySelect.innerHTML = '<option value="">All Categories</option>';
        authorSelect.innerHTML = '<option value="">All Authors</option>';

        const categories = new Set();
        const authors = new Set();

        for (const s of allSchems) {
            if (Array.isArray(s.tags)) {
                s.tags.forEach(t => categories.add(t));
            }
            const profile = allProfiles.find(p => p.id === s.uploaded_by);
            if (profile) authors.add(profile.username);
        }

        categories.forEach(cat => {
            const opt = document.createElement("option");
            opt.value = cat;
            opt.textContent = cat;
            categorySelect.appendChild(opt);
        });

        authors.forEach(name => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name;
            authorSelect.appendChild(opt);
        });
    }

    function getFilteredSortedSchems() {
        const search = document.getElementById("searchInput").value.toLowerCase();
        const category = document.getElementById("categorySelect").value;
        const author = document.getElementById("authorSelect").value;
        const sort = document.getElementById("sortSelect").value;

        let filtered = allSchems.filter(s => {
            const profile = allProfiles.find(p => p.id === s.uploaded_by);
            const username = profile?.username || "Unknown";

            const matchesSearch =
                s.name.toLowerCase().includes(search) ||
                s.description.toLowerCase().includes(search) ||
                (Array.isArray(s.tags) && s.tags.join(" ").toLowerCase().includes(search));

            const matchesCategory =
                !category || (Array.isArray(s.tags) && s.tags.includes(category));

            const matchesAuthor =
                !author || username === author;

            return matchesSearch && matchesCategory && matchesAuthor;
        });

        if (sort === "liked") {
            filtered.sort((a, b) => {
                const likesA = allLikes.filter(l => l.schematic_id === a.id).length;
                const likesB = allLikes.filter(l => l.schematic_id === b.id).length;
                return likesB - likesA;
            });
        } else if (sort === "alpha") {
            filtered.sort((a, b) => a.name.localeCompare(b.name));
        } else {
            filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        }

        return filtered;
    }

    function renderFeatured() {
        const featuredCard = document.getElementById("featuredCard");
        if (!allSchems.length) {
            featuredCard.style.display = "none";
            return;
        }

        let best = null;
        let bestLikes = -1;

        for (const s of allSchems) {
            const likes = allLikes.filter(l => l.schematic_id === s.id).length;
            if (likes > bestLikes) {
                bestLikes = likes;
                best = s;
            }
        }

        if (!best) {
            featuredCard.style.display = "none";
            return;
        }

        const profile = allProfiles.find(p => p.id === best.uploaded_by);
        const username = profile?.username || "Unknown";

        featuredCard.style.display = "flex";
        featuredCard.innerHTML = `
            <img src="${best.image}" alt="${best.name}">
            <div>
                <h2>⭐ Featured: ${best.name}</h2>
                <p>${best.description}</p>
                <p><strong>Author:</strong> ${username}</p>
                <div class="tag-badges">
                    ${(Array.isArray(best.tags) ? best.tags : [])
                        .map(t => `<span class="tag-badge">${t}</span>`).join("")}
                </div>
                <p><strong>Likes:</strong> ${bestLikes}</p>
                <button onclick="window.location='${best.file}'">
                    Download Schematic
                </button>
            </div>
        `;
    }

    function renderSchematics() {
        const container = document.getElementById("schemContainer");
        container.innerHTML = "";

        const filtered = getFilteredSortedSchems();

        const start = (currentPage - 1) * pageSize;
        const pageItems = filtered.slice(start, start + pageSize);

        for (const s of pageItems) {
            const id = s.id;

            const likeCount = allLikes.filter(l => l.schematic_id === id).length;

            const profile = allProfiles.find(p => p.id === s.uploaded_by);
            const username = profile?.username || "Unknown";

            const card = document.createElement("div");
            card.className = "schem-card";

            card.innerHTML = `
                <img src="${s.image}" alt="${s.name}">
                <h3>${s.name}</h3>
                <p>${s.description}</p>
                <p><strong>Author:</strong> ${username}</p>
                <div class="tag-badges">
                    ${(Array.isArray(s.tags) ? s.tags : [])
                        .map(t => `<span class="tag-badge">${t}</span>`).join("")}
                </div>

                <button onclick="window.location='${s.file}'">
                    Download Schematic
                </button>

                <button class="like-btn" onclick="likeSchematic('${id}')">
                    ❤️ Like (${likeCount})
                </button>
            `;

            if (currentUser?.user_metadata?.role === "admin") {
                const delBtn = document.createElement("button");
                delBtn.className = "delete-btn";
                delBtn.innerText = "🗑️ Delete Schematic";
                delBtn.onclick = () => deleteSchematic(s);
                card.appendChild(delBtn);
            }

            container.appendChild(card);
        }
    }

    function renderPagination() {
        const pagination = document.getElementById("pagination");
        pagination.innerHTML = "";

        const filtered = getFilteredSortedSchems();
        const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));

        if (currentPage > totalPages) currentPage = totalPages;

        for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement("button");
            btn.textContent = i;
            if (i === currentPage) btn.classList.add("active");
            btn.onclick = () => {
                currentPage = i;
                renderSchematics();
                renderPagination();
            };
            pagination.appendChild(btn);
        }
    }

    async function likeSchematic(id) {
        if (!currentUser) {
            alert("You must be logged in to like schematics.");
            return;
        }

        const alreadyLiked = allLikes.some(
            l => l.user_id === currentUser.id && l.schematic_id === id
        );

        if (alreadyLiked) {
            alert("You already liked this schematic.");
            return;
        }

        await client.from("schematic_likes").insert({
            user_id: currentUser.id,
            schematic_id: id
        });

        await loadData();
    }
async function deleteSchematic(s) {
    if (!confirm("Are you sure you want to delete this schematic?")) return;

    // Delete image file
    const imagePath = s.image.replace("https://pnkwqqapyoaxdcpubpwb.supabase.co/storage/v1/object/public/", "");
    await client.storage.from("images").remove([imagePath]);

    // Delete schematic file
    const filePath = s.file.replace("https://pnkwqqapyoaxdcpubpwb.supabase.co/storage/v1/object/public/", "");
    await client.storage.from("schematics").remove([filePath]);

    // Delete metadata
    await client.from("schematics").delete().eq("id", s.id);

    // Delete likes
    await client.from("schematic_likes").delete().eq("schematic_id", s.id);

    alert("Schematic deleted.");
    await loadData();
}

    

    async function applyAdminVisibility() {
        const uploadTab = document.getElementById("uploadTab");
        const { data: { session } } = await client.auth.getSession();
        const user = session?.user;

        if (!user || user.user_metadata?.role !== "admin") {
            uploadTab.style.display = "none";
        }
    }

    function setupThemeToggle() {
        const btn = document.getElementById("themeToggle");
        btn.onclick = () => {
            document.body.classList.toggle("light");
        };
    }

    async function init() {
        await loadUser();
        await new Promise(r => setTimeout(r, 200));
        await applyAdminVisibility();
        await loadData();
        setupThemeToggle();

        document.getElementById("searchInput").oninput = () => {
            currentPage = 1;
            renderSchematics();
            renderPagination();
        };
        document.getElementById("categorySelect").onchange = () => {
            currentPage = 1;
            renderSchematics();
            renderPagination();
        };
        document.getElementById("authorSelect").onchange = () => {
            currentPage = 1;
            renderSchematics();
            renderPagination();
        };
        document.getElementById("sortSelect").onchange = () => {
            currentPage = 1;
            renderSchematics();
            renderPagination();
            renderFeatured();
        };
    }

    init();
</script>

</body>
</html>
