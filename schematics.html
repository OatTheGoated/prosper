<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProsperMC Schematics</title>

    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 32px;
        }

        .schem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .schem-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 10px #000;
        }

        .schem-card img {
            width: 100%;
            border-radius: 8px;
        }

        .schem-card h3 {
            margin-top: 10px;
            font-size: 20px;
        }

        .schem-card p {
            font-size: 14px;
            opacity: 0.85;
        }

        .schem-card button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .like-btn {
            background: #ff4444 !important;
        }

        .delete-btn {
            background: #aa0000 !important;
        }
    </style>

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const client = supabase.createClient(
            "https://pnkwqqapyoaxdcpubpwb.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBua3dxcWFweW9heGRjcHVicHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MzcsImV4cCI6MjEwNjcxNjczN30.HiM5-OSJUoJ_3AXSkfEmhgWVs8lU5lNNj4FbIai1Bkc"
        );

        let currentUser = null;
    </script>
</head>

<body>

<nav class="navbar" style="background:#000; padding:10px 20px;">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between;">
        <h1 class="logo pixel">⛏️ Prosper</h1>
        <ul class="nav-links" style="list-style:none; display:flex; gap:20px; padding:0; margin:0;">
            <li><a href="index.html">Home</a></li>
            <li><a href="modpacks.html">Modpacks</a></li>
            <li><a href="schematics.html" class="active">Schematics</a></li>
            <li><a href="videos.html">Videos</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="/prosper/admin/upload.html" id="uploadTab">Upload</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </div>
</nav>

<h1>ProsperMC Schematics</h1>

<div id="schemContainer" class="schem-grid"></div>

<script>
    // ⭐ Load user
    async function loadUser() {
        const { data: { user } } = await client.auth.getUser();
        currentUser = user;
    }

    loadUser();

    // ⭐ Load schematics
    async function loadSchematics() {
        const container = document.getElementById("schemContainer");
        container.innerHTML = "";

        const { data: schems, error } = await client
            .from("schematics")
            .select("*")
            .order("created_at", { ascending: false });

        if (error) {
            console.error(error);
            return;
        }

        for (const s of schems) {
            const id = s.id;

            // ⭐ Count likes
            const { count } = await client
                .from("schematic_likes")
                .select("*", { count: "exact", head: true })
                .eq("schematic_id", id);

            const card = document.createElement("div");
            card.className = "schem-card";

            card.innerHTML = `
                <img src="${s.image}" alt="${s.name}">
                <h3>${s.name}</h3>
                <p>${s.description}</p>
                <p><strong>Tags:</strong> ${Array.isArray(s.tags) ? s.tags.join(", ") : s.tags}</p>

                <button onclick="window.location='${s.file}'">
                    Download Schematic
                </button>

                <button class="like-btn" onclick="likeSchematic('${id}')">
                    ❤️ Like (${count})
                </button>
            `;

            // ⭐ Admin delete button
            if (currentUser) {
                const { data: profile } = await client
                    .from("profiles")
                    .select("role")
                    .eq("id", currentUser.id)
                    .maybeSingle();

                if (profile?.role === "admin") {
                    const delBtn = document.createElement("button");
                    delBtn.className = "delete-btn";
                    delBtn.innerText = "🗑️ Delete Schematic";
                    delBtn.onclick = () => deleteSchematic(s);
                    card.appendChild(delBtn);
                }
            }

            container.appendChild(card);
        }
    }

    loadSchematics();

    // ⭐ Like schematic
    async function likeSchematic(id) {
        if (!currentUser) {
            alert("You must be logged in to like schematics.");
            return;
        }

        const { error } = await client
            .from("schematic_likes")
            .insert({
                user_id: currentUser.id,
                schematic_id: id
            });

        if (error) {
            alert("You already liked this schematic.");
            return;
        }

        loadSchematics();
    }

    // ⭐ Delete schematic (admin only)
    async function deleteSchematic(s) {
        if (!confirm("Are you sure you want to delete this schematic?")) return;

        // Delete image file
        await client.storage.from("images").remove([
            s.image.replace(/^.*\/storage\/v1\/object\/public\/images\//, "")
        ]);

        // Delete schematic file
        await client.storage.from("schematics").remove([
            s.file.replace(/^.*\/storage\/v1\/object\/public\/schematics\//, "")
        ]);

        // Delete metadata
        await client.from("schematics").delete().eq("id", s.id);

        // Delete likes
        await client.from("schematic_likes").delete().eq("schematic_id", s.id);

        alert("Schematic deleted.");
        loadSchematics();
    }

    // ⭐ Admin visibility
    async function applyAdminVisibility() {
        const uploadTab = document.getElementById("uploadTab");

        const { data: { user } } = await client.auth.getUser();
        if (!user) {
            uploadTab.style.display = "none";
            return;
        }

        const { data: profile } = await client
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .maybeSingle();

        if (!profile || profile.role !== "admin") {
            uploadTab.style.display = "none";
        }
    }

    applyAdminVisibility();
</script>

</body>
</html>
