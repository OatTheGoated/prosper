<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProsperMC Schematics</title>

    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 32px;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 20px;
        }

        .top-bar input, .top-bar select {
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
        }

        .schem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .schem-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 10px #000;
        }

        .schem-card img {
            width: 100%;
            border-radius: 8px;
        }

        .schem-card h3 {
            margin-top: 10px;
            font-size: 20px;
        }

        .schem-card p {
            font-size: 14px;
            opacity: 0.85;
        }

        .schem-card button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .like-btn {
            background: #ff4444 !important;
        }

        .delete-btn {
            background: #aa0000 !important;
        }
    </style>

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const client = supabase.createClient(
            "https://pnkwqqapyoaxdcpubpwb.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBua3dxcWFweW9heGRjcHVicHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MzcsImV4cCI6MjEwNjcxNjczN30.HiM5-OSJUoJ_3AXSkfEmhgWVs8lU5lNNj4FbIai1Bkc"
        );

        let currentUser = null;
        let allSchems = [];
        let allLikes = [];
        let allProfiles = [];
    </script>
</head>

<body>

<nav class="navbar" style="background:#000; padding:10px 20px;">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between;">
        <h1 class="logo pixel">⛏️ Prosper</h1>
        <ul class="nav-links" style="list-style:none; display:flex; gap:20px; padding:0; margin:0;">
            <li><a href="index.html">Home</a></li>
            <li><a href="modpacks.html">Modpacks</a></li>
            <li><a href="schematics.html" class="active">Schematics</a></li>
            <li><a href="videos.html">Videos</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="/prosper/admin/upload.html" id="uploadTab">Upload</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </div>
</nav>

<h1>ProsperMC Schematics</h1>

<!-- ⭐ Search + Category + Author -->
<div class="top-bar">
    <input id="searchInput" placeholder="Search schematics...">
    <select id="categorySelect">
        <option value="">All Categories</option>
    </select>
    <select id="authorSelect">
        <option value="">All Authors</option>
    </select>
</div>

<div id="schemContainer" class="schem-grid"></div>

<script>
    // ⭐ Load user
    async function loadUser() {
        const { data: { session } } = await client.auth.getSession();
        currentUser = session?.user || null;
    }

    // ⭐ Load all data in parallel
    async function loadData() {
        const [schemRes, likeRes, profileRes] = await Promise.all([
            client.from("schematics").select("*").order("created_at", { ascending: false }),
            client.from("schematic_likes").select("schematic_id, user_id"),
            client.from("profiles").select("id, username")
        ]);

        allSchems = schemRes.data || [];
        allLikes = likeRes.data || [];
        allProfiles = profileRes.data || [];

        populateFilters();
        renderSchematics();
    }

    // ⭐ Populate category + author filters
    function populateFilters() {
        const categorySelect = document.getElementById("categorySelect");
        const authorSelect = document.getElementById("authorSelect");

        const categories = new Set();
        const authors = new Set();

        for (const s of allSchems) {
            if (Array.isArray(s.tags)) {
                s.tags.forEach(t => categories.add(t));
            }
            const profile = allProfiles.find(p => p.id === s.uploaded_by);
            if (profile) authors.add(profile.username);
        }

        // Categories
        categories.forEach(cat => {
            const opt = document.createElement("option");
            opt.value = cat;
            opt.textContent = cat;
            categorySelect.appendChild(opt);
        });

        // Authors
        authors.forEach(name => {
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name;
            authorSelect.appendChild(opt);
        });
    }

    // ⭐ Render schematics with filters + search
    function renderSchematics() {
        const container = document.getElementById("schemContainer");
        container.innerHTML = "";

        const search = document.getElementById("searchInput").value.toLowerCase();
        const category = document.getElementById("categorySelect").value;
        const author = document.getElementById("authorSelect").value;

        const filtered = allSchems.filter(s => {
            const profile = allProfiles.find(p => p.id === s.uploaded_by);
            const username = profile?.username || "Unknown";

            const matchesSearch =
                s.name.toLowerCase().includes(search) ||
                s.description.toLowerCase().includes(search) ||
                (Array.isArray(s.tags) && s.tags.join(" ").toLowerCase().includes(search));

            const matchesCategory =
                !category || (Array.isArray(s.tags) && s.tags.includes(category));

            const matchesAuthor =
                !author || username === author;

            return matchesSearch && matchesCategory && matchesAuthor;
        });

        for (const s of filtered) {
            const id = s.id;

            const likeCount = allLikes.filter(l => l.schematic_id === id).length;

            const profile = allProfiles.find(p => p.id === s.uploaded_by);
            const username = profile?.username || "Unknown";

            const card = document.createElement("div");
            card.className = "schem-card";

            card.innerHTML = `
                <img src="${s.image}" alt="${s.name}">
                <h3>${s.name}</h3>
                <p>${s.description}</p>
                <p><strong>Tags:</strong> ${Array.isArray(s.tags) ? s.tags.join(", ") : s.tags}</p>
                <p><strong>Author:</strong> ${username}</p>

                <button onclick="window.location='${s.file}'">
                    Download Schematic
                </button>

                <button class="like-btn" onclick="likeSchematic('${id}')">
                    ❤️ Like (${likeCount})
                </button>
            `;

            if (currentUser?.user_metadata?.role === "admin") {
                const delBtn = document.createElement("button");
                delBtn.className = "delete-btn";
                delBtn.innerText = "🗑️ Delete Schematic";
                delBtn.onclick = () => deleteSchematic(s);
                card.appendChild(delBtn);
            }

            container.appendChild(card);
        }
    }

    // ⭐ Like schematic (no duplicates)
    async function likeSchematic(id) {
        if (!currentUser) {
            alert("You must be logged in to like schematics.");
            return;
        }

        const alreadyLiked = allLikes.some(
            l => l.user_id === currentUser.id && l.schematic_id === id
        );

        if (alreadyLiked) {
            alert("You already liked this schematic.");
            return;
        }

        await client.from("schematic_likes").insert({
            user_id: currentUser.id,
            schematic_id: id
        });

        await loadData();
    }

    // ⭐ Delete schematic
    async function deleteSchematic(s) {
        if (!confirm("Are you sure you want to delete this schematic?")) return;

        await client.storage.from("images").remove([
            s.image.replace(/^.*\/storage\/v1\/object\/public\/images\//, "")
        ]);

        await client.storage.from("schematics").remove([
            s.file.replace(/^.*\/storage\/v1\/object\/public\/schematics\//, "")
        ]);

        await client.from("schematics").delete().eq("id", s.id);
        await client.from("schematic_likes").delete().eq("schematic_id", s.id);

        await loadData();
    }

    // ⭐ Admin visibility
    async function applyAdminVisibility() {
        const uploadTab = document.getElementById("uploadTab");
        const { data: { session } } = await client.auth.getSession();
        const user = session?.user;

        if (!user || user.user_metadata?.role !== "admin") {
            uploadTab.style.display = "none";
        }
    }

    // ⭐ Initialize
    async function init() {
        await loadUser();
        await new Promise(r => setTimeout(r, 200));
        await applyAdminVisibility();
        await loadData();

        document.getElementById("searchInput").oninput = renderSchematics;
        document.getElementById("categorySelect").onchange = renderSchematics;
        document.getElementById("authorSelect").onchange = renderSchematics;
    }

    init();
</script>

</body>
</html>
