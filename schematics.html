<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ProsperMC Schematics</title>

    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-size: 32px;
        }

        .schem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .schem-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 0 10px #000;
        }

        .schem-card img {
            width: 100%;
            border-radius: 8px;
        }

        .schem-card h3 {
            margin-top: 10px;
            font-size: 20px;
        }

        .schem-card p {
            font-size: 14px;
            opacity: 0.85;
        }

        .schem-card button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .like-btn {
            background: #ff4444 !important;
        }

        .delete-btn {
            background: #aa0000 !important;
        }
    </style>
</head>
<body>

            <li><a href="login.html">Login</a></li>
        </ul>
    </div>
</nav>

<h1>ProsperMC Schematics</h1>

<div id="schemContainer" class="schem-grid"></div>

<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    /* ⭐ Updated to your new Supabase project */
    const supabase = createClient(
        "https://pnkwqqapyoxadcpubpwb.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBua3dxcWFweW9heGRjcHVicHdiIiwicm9zZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MzcsImV4cCI6MjEwNjcxNjczN30.HiM5-OSJUoJ_3AXSkfEmhgWVs8lU5lNNj4FbIai1Bkc"
    );

    let currentUser = null;

    async function loadUser() {
        const { data: { user } } = await supabase.auth.getUser();
        currentUser = user;
    }

    async function loadSchematics() {
        await loadUser();

        const { data: schems, error } = await supabase
            .from("schematics")
            .select("*")
            .order("created_at", { ascending: false });

        if (error) {
            console.error("Error loading schematics:", error);
            return;
        }

        const container = document.getElementById("schemContainer");
        container.innerHTML = "";

        for (const s of schems) {

            const imageUrl = supabase.storage
                .from("images")
                .getPublicUrl(s.image).data.publicUrl;

            const fileUrl = supabase.storage
                .from("schematics")
                .getPublicUrl(s.file).data.publicUrl;

            const { count } = await supabase
                .from("schematic_likes")
                .select("*", { count: "exact", head: true })
                .eq("schematic_id", s.id);

            const card = document.createElement("div");
            card.className = "schem-card";

            card.innerHTML = `
                <img src="${imageUrl}" alt="${s.name}">
                <h3>${s.name}</h3>
                <p>${s.description}</p>
                <p><strong>Tags:</strong> ${Array.isArray(s.tags) ? s.tags.join(", ") : s.tags}</p>

                <button onclick="window.location='${fileUrl}'">
                    Download Schematic
                </button>

                <button class="like-btn" onclick="likeSchematic('${s.id}')">
                    ❤️ Like (${count})
                </button>
            `;

            if (currentUser && currentUser.user_metadata?.role === "admin") {
                const delBtn = document.createElement("button");
                delBtn.className = "delete-btn";
                delBtn.innerText = "🗑️ Delete Schematic";
                delBtn.onclick = () => deleteSchematic(s);
                card.appendChild(delBtn);
            }

            container.appendChild(card);
        }
    }

    async function likeSchematic(id) {
        const { data: { user } } = await supabase.auth.getUser();

        if (!user) {
            alert("You must be logged in to like schematics.");
            return;
        }

        const { error } = await supabase
            .from("schematic_likes")
            .insert({ user_id: user.id, schematic_id: id });

        if (error) {
            alert("You already liked this schematic.");
            return;
        }

        loadSchematics();
    }

    async function deleteSchematic(s) {
        if (!confirm("Are you sure you want to delete this schematic?")) return;

        await supabase.storage.from("images").remove([s.image]);
        await supabase.storage.from("schematics").remove([s.file]);

        await supabase.from("schematics").delete().eq("id", s.id);
        await supabase.from("schematic_likes").delete().eq("schematic_id", s.id);

        alert("Schematic deleted.");
        loadSchematics();
    }

    loadSchematics();
</script>

    async function applyAdminVisibility() {
        const uploadTab = document.getElementById("uploadTab");

        if (!uploadTab) return;

        const { data: { user } } = await supabaseAdmin.auth.getUser();

    applyAdminVisibility();

</body>
</html>
