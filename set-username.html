<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Username – Prosper</title>
    <link rel="stylesheet" href="./style.css?v=22">

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const client = supabase.createClient(
            "https://pnkwqqapyoaxdcpubpwb.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBua3dxcWFweW9heGRjcHVicHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MzcsImV4cCI6MjEwNjcxNjczN30.HiM5-OSJUoJ_3AXSkfEmhgWVs8lU5lNNj4FbIai1Bkc"
        );
    </script>
</head>

<body>
<div class="site">

    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>

                <!-- ⭐ Upload tab (admin only) -->
                <li><a href="admin/upload.html" id="uploadTab" style="display:none;">Upload</a></li>

                <li><a href="login.html" id="authNavBtn">Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" style="margin-top:40px;">
        <h1 class="pixel">Choose a Username</h1>
        <p class="pixel-small">This will be your public name on Prosper.</p>

        <div class="auth-box" style="margin-top:20px;">
            <input id="username" placeholder="Enter a username">
            <button class="btn-red" id="saveUsernameBtn">Save Username</button>
            <p id="status" class="pixel-small" style="margin-top:20px;"></p>
        </div>
    </section>

</div>

<script>
    const status = document.getElementById("status");
    const usernameInput = document.getElementById("username");
    const saveBtn = document.getElementById("saveUsernameBtn");
    const uploadTab = document.getElementById("uploadTab");
    const authNavBtn = document.getElementById("authNavBtn");

    async function initUser() {
        const { data: { user } } = await client.auth.getUser();

        if (!user) {
            status.textContent = "You must be logged in to set a username.";
            status.style.color = "#ff6b6b";
            saveBtn.disabled = true;
            return;
        }

        authNavBtn.textContent = "Logout";
        authNavBtn.href = "#";
        authNavBtn.onclick = async (e) => {
            e.preventDefault();
            await client.auth.signOut();
            window.location.href = "login.html";
        };

        // Load existing profile
        const { data: profile } = await client
            .from("profiles")
            .select("username, role")
            .eq("id", user.id)
            .maybeSingle();

        if (profile) {
            if (profile.username) {
                usernameInput.value = profile.username;
            }
            if (profile.role === "admin" || user.user_metadata?.role === "admin") {
                uploadTab.style.display = "inline-block";
            }
        }
    }

    saveBtn.onclick = async function () {
        const username = usernameInput.value.trim();

        status.style.color = "#00ff88";
        status.textContent = "Checking...";

        const { data: { user } } = await client.auth.getUser();

        if (!user) {
            status.textContent = "You must be logged in.";
            status.style.color = "#ff6b6b";
            return;
        }

        if (!username || username.length < 3) {
            status.textContent = "Username must be at least 3 characters.";
            status.style.color = "#ff6b6b";
            return;
        }

        // Check if username is taken by another user
        const { data: existing, error: lookupError } = await client
            .from("profiles")
            .select("id")
            .eq("username", username);

        if (lookupError) {
            status.textContent = "Error checking username: " + lookupError.message;
            status.style.color = "#ff6b6b";
            return;
        }

        if (existing && existing.length > 0 && existing[0].id !== user.id) {
            status.textContent = "That username is already taken.";
            status.style.color = "#ff6b6b";
            return;
        }

        // Update username in profiles table
        const { error: updateError } = await client
            .from("profiles")
            .upsert({
                id: user.id,
                username: username,
                email: user.email
            });

        if (updateError) {
            status.textContent = "Error saving username: " + updateError.message;
            status.style.color = "#ff6b6b";
            return;
        }

        status.textContent = "Username saved! Redirecting to dashboard...";
        status.style.color = "#00ff88";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 800);
    };

    initUser();
</script>

</body>
</html>
