<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Username</title>
    <link rel="stylesheet" href="./style.css?v=22">
</head>

<body>
<div class="site">

    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>

                <!-- ⭐ Upload tab (admin only) -->
                <li><a href="/prosper/admin/upload.html" id="uploadTab">Upload</a></li>

                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" style="margin-top:40px;">
        <h1 class="pixel">Choose a Username</h1>
        <p class="pixel-small">This will be your public name on Prosper.</p>

        <div class="auth-box" style="margin-top:20px;">
            <input id="username" placeholder="Enter a username">
            <button class="btn-red" onclick="saveUsername()">Save Username</button>
            <p id="status" class="pixel-small" style="margin-top:20px; color: #00ff88;"></p>
        </div>
    </section>

</div>

<!-- ⭐ USERNAME SCRIPT (Supabase version) -->
<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
        "https://pnkwqqapyoxadcpubpwb.supabase.co",
        "sb_publishable_FOGjeeE78yPzd0dIz-18XQ_t2J6MMLz"
    );

    window.saveUsername = async function () {
        const status = document.getElementById("status");
        const username = document.getElementById("username").value.trim();

        status.style.color = "#00ff88";
        status.textContent = "Checking...";

        const { data: { user } } = await supabase.auth.getUser();

        if (!user) {
            status.textContent = "You must be logged in.";
            status.style.color = "#ff6b6b";
            return;
        }

        if (!username || username.length < 3) {
            status.textContent = "Username must be at least 3 characters.";
            status.style.color = "#ff6b6b";
            return;
        }

        // ⭐ Check if username is taken
        const { data: existing, error: lookupError } = await supabase
            .from("profiles")
            .select("id")
            .eq("Username", username);

        if (lookupError) {
            status.textContent = "Error checking username: " + lookupError.message;
            status.style.color = "#ff6b6b";
            return;
        }

        if (existing && existing.length > 0 && existing[0].id !== user.id) {
            status.textContent = "That username is already taken.";
            status.style.color = "#ff6b6b";
            return;
        }

        // ⭐ Update username
        const { error: updateError } = await supabase
            .from("profiles")
            .update({
                Username: username,
                Email: user.email
            })
            .eq("id", user.id);

        if (updateError) {
            status.textContent = "Error saving username: " + updateError.message;
            status.style.color = "#ff6b6b";
            return;
        }

        status.textContent = "Username saved! Redirecting...";
        status.style.color = "#00ff88";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 800);
    };
</script>

<!-- ⭐ ADMIN VISIBILITY SCRIPT -->
<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseAdmin = createClient(
        "https://pnkwqqapyoxadcpubpwb.supabase.co",
        "sb_publishable_FOGjeeE78yPzd0dIz-18XQ_t2J6MMLz"
    );

    async function applyAdminVisibility() {
        const uploadTab = document.getElementById("uploadTab");
        if (!uploadTab) return;

        const { data: { user } } = await supabaseAdmin.auth.getUser();

        if (!user || user.user_metadata?.role !== "admin") {
            uploadTab.style.display = "none";
        }
    }

    applyAdminVisibility();
</script>

</body>
</html>
