<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard – Prosper</title>
    <link rel="stylesheet" href="./style.css?v=25">

    <!-- Supabase UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const client = supabase.createClient(
            "https://pnkwqqapyoaxdcpubpwb.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBua3dxcWFweW9heGRjcHVicHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDA3MzcsImV4cCI6MjEwNjcxNjczN30.HiM5-OSJUoJ_3AXSkfEmhgWVs8lU5lNNj4FbIai1Bkc"
        );
    </script>
</head>

<body>

<!-- HAMBURGER MENU -->
<div class="hamburger" id="hamburgerBtn">
    <span></span>
    <span></span>
    <span></span>
</div>

<!-- SIDEBAR (Dashboard content inside) -->
<div class="sidebar" id="sidebar">

    <h2 class="pixel">⛏️ Prosper</h2>

    <div class="sidebar-section">
        <h3 class="pixel-small">Account Info</h3>
        <p>Email: <span id="emailDisplay"></span></p>
        <p>User ID: <span id="idDisplay"></span></p>
        <p>Username: <span id="usernameDisplay"></span></p>
    </div>

    <div class="sidebar-section">
        <h3 class="pixel-small">Profile Picture</h3>
        <img id="profilePic" class="pfp-img" src="" alt="Profile Picture">

        <label class="pixel-small" style="margin-top:10px; display:block;">
            Enter your Minecraft UUID:
        </label>

        <input id="mcUUID" placeholder="2982b204842f4220a668f73fa9822c6d">

        <button class="btn-red" id="savePfpBtn" style="margin-top:10px;">
            Save Profile Picture
        </button>
    </div>

    <button id="logoutBtn" class="sidebar-logout" style="margin-top:30px;">
        Logout
    </button>

</div>

<!-- DARK OVERLAY -->
<div id="overlay"></div>

<!-- MAIN CONTENT -->
<div class="main-content">
    <h1 class="pixel">Dashboard</h1>
    <p class="pixel-small">Use the menu to manage your account.</p>
</div>

<script>
    async function loadDashboard() {
        const { data: { session } } = await client.auth.getSession();

        // Prevent access if not logged in
        if (!session) {
            document.getElementById("sidebar").style.display = "none";
            document.getElementById("hamburgerBtn").style.display = "none";
            window.location.href = "login.html";
            return;
        }

        const user = session.user;

        // Fill account info
        document.getElementById("emailDisplay").textContent = user.email;
        document.getElementById("idDisplay").textContent = user.id;

        // Load profile table
        const { data: profile } = await client
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .maybeSingle();

        if (profile) {
            document.getElementById("usernameDisplay").textContent =
                profile.username || "Unknown";

            if (profile.pfp_url) {
                document.getElementById("profilePic").src = profile.pfp_url;
            }

            if (profile.mc_uuid) {
                document.getElementById("mcUUID").value = profile.mc_uuid;
            }
        }
    }

    loadDashboard();

    // UUID preview
    document.getElementById("mcUUID").addEventListener("input", () => {
        let uuid = document.getElementById("mcUUID").value.trim().replace(/-/g, "");
        if (uuid.length === 32) {
            document.getElementById("profilePic").src =
                `https://crafatar.com/avatars/${uuid}?size=128&overlay`;
        }
    });

    // Save profile picture + UUID
    document.getElementById("savePfpBtn").onclick = async () => {
        let uuid = document.getElementById("mcUUID").value.trim().replace(/-/g, "");
        if (uuid.length !== 32) {
            alert("UUID must be exactly 32 characters.");
            return;
        }

        const { data: { session } } = await client.auth.getSession();
        if (!session) return;

        const user = session.user;
        const pfpURL = `https://crafatar.com/avatars/${uuid}?size=128&overlay`;

        await client
            .from("profiles")
            .update({ pfp_url: pfpURL, mc_uuid: uuid })
            .eq("id", user.id);

        document.getElementById("profilePic").src = pfpURL;
        alert("Profile picture updated!");
    };

    // Logout
    document.getElementById("logoutBtn").onclick = async () => {
        await client.auth.signOut();
        window.location.href = "index.html";
    };

    // SIDEBAR TOGGLE
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const hamburger = document.getElementById("hamburgerBtn");

    hamburger.onclick = () => {
        sidebar.classList.add("open");
        overlay.classList.add("show");
    };

    overlay.onclick = () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
    };
</script>

</body>
</html>
