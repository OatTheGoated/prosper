<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard – Prosper</title>
    <link rel="stylesheet" href="./style.css?v=22">

    <!-- Supabase UMD (works on GitHub Pages) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://pnkwqqapyoxadcpubpwb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FOGjeeE78yPzd0dIz-18XQ_t2J6MMLz";

        // ⭐ FIX: use "client" instead of "supabase"
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
</head>

<body>
<div class="site">

    <nav class="navbar">
        <div class="container">
            <h1 class="logo pixel">⛏️ Prosper</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="modpacks.html">Modpacks</a></li>
                <li><a href="schematics.html">Schematics</a></li>
                <li><a href="videos.html">Videos</a></li>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>

                <!-- Admin-only -->
                <li><a href="/prosper/admin/upload.html" id="uploadTab">Upload</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" style="margin-top:40px;">
        <h1 class="pixel">Your Dashboard</h1>

        <div class="auth-box">
            <h3 class="pixel-small">Account Info</h3>
            <p>Email: <span id="emailDisplay"></span></p>
            <p>User ID: <span id="idDisplay"></span></p>
            <p>Username: <span id="usernameDisplay"></span></p>

            <h3 class="pixel-small" style="margin-top:20px;">Profile Picture</h3>
            <img id="profilePic" src="" alt="Profile Picture" style="width:128px; border-radius:8px; margin-bottom:10px;">

            <label class="pixel-small" style="margin-bottom:6px; display:block;">
                Enter your Minecraft UUID (32 characters, no dashes):
            </label>

            <input id="mcUUID" placeholder="2982b204842f4220a668f73fa9822c6d">

            <button class="btn-red" id="savePfpBtn" style="margin-top:10px;">
                Save Profile Picture
            </button>

            <button class="btn-red" id="logoutBtn" style="margin-top:20px;">
                Logout
            </button>
        </div>
    </section>

</div>

<script>
    async function loadDashboard() {
        const { data: { user } } = await client.auth.getUser();

        if (!user) {
            window.location.href = "login.html";
            return;
        }

        // Display basic info
        document.getElementById("emailDisplay").textContent = user.email;
        document.getElementById("idDisplay").textContent = user.id;

        // Load profile from Supabase
        const { data: profileData, error } = await client
            .from("profiles")
            .select("*")
            .eq("id", user.id)
            .maybeSingle();

        if (profileData) {
            document.getElementById("usernameDisplay").textContent =
                profileData.username || "Unknown";

            if (profileData.pfp_url) {
                document.getElementById("profilePic").src = profileData.pfp_url;
            }

            // Admin visibility
            if (profileData.role !== "admin") {
                document.getElementById("uploadTab").style.display = "none";
            }
        } else {
            document.getElementById("usernameDisplay").textContent = "Unknown";
        }
    }

    loadDashboard();

    // Live preview of UUID avatar
    document.getElementById("mcUUID").addEventListener("input", () => {
        let uuid = document.getElementById("mcUUID").value.trim().replace(/-/g, "");
        if (uuid.length === 32) {
            document.getElementById("profilePic").src =
                `https://crafatar.com/avatars/${uuid}?size=128&overlay`;
        }
    });

    // Save profile picture
    document.getElementById("savePfpBtn").addEventListener("click", async () => {
        let uuid = document.getElementById("mcUUID").value.trim().replace(/-/g, "");
        if (uuid.length !== 32) {
            alert("UUID must be exactly 32 characters.");
            return;
        }

        const { data: { user } } = await client.auth.getUser();
        if (!user) {
            alert("You must be logged in.");
            return;
        }

        const pfpURL = `https://crafatar.com/avatars/${uuid}?size=128&overlay`;

        const { error } = await client
            .from("profiles")
            .update({ pfp_url: pfpURL })
            .eq("id", user.id);

        if (error) {
            alert("Failed to update profile picture.");
            return;
        }

        document.getElementById("profilePic").src = pfpURL;
        alert("Profile picture updated!");
    });

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
        await client.auth.signOut();
        window.location.href = "index.html";
    });
</script>

</body>
</html>
